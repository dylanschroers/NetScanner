[package]
name = "netscanner"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio        = { version = "1", features = ["full"] }
pnet         = "0.35"
clap         = { version = "4", features = ["derive"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
comfy-table  = "7"
cidr         = "0.2"
ratatui      = "0.28"
crossterm    = "0.28"
